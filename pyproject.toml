[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "im-just-a-bill"
version = "0.1.0"
description = "Builds and updates the im-just-a-bill Hugging Face dataset of Congress.gov and GovInfo documents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# Exact versions: this is an unattended application, and these are the versions the tests and live runs used.
dependencies = [
    "httpx==0.28.1",
    "lxml==6.1.3",
    "pyarrow==25.0.1",
    "huggingface_hub==1.32.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.3"]

[tool.setuptools]
packages = ["ijab", "ijab.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
