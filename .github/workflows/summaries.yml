# At 00:00 and 12:00 UTC, read the CRS bill and resolution summaries changed since the last run and commit the slices they change. Once a day the run also asks the API for every slice's count and reads again in full the slices that differ, and the slices read longest ago. After a run that committed, verify the Hub against the manifest (the daily count check is the comparison with the API), and squash long history. A run that ran out of budget while still reading starts the next run itself.
# Writes to Hugging Face use Trusted Publishing: with `id-token: write`, the CLI sets HF_OIDC_RESOURCE from the dataset's repo, so no Hugging Face token is stored anywhere. The only secret is the api.data.gov key, which pipeline.yml uses too.
name: summaries

on:
  schedule:
    # Every SCHEDULE_HOURS in crs_products/summaries.py; a test checks that the two agree.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutes the run may take (empty: the CLI default)"
        default: ""
      args:
        description: "Extra run arguments for a bounded test, e.g. --local /tmp/smoke --partitions 119-sconres (skips verify and squash)"
        default: ""

permissions: {}

concurrency:
  group: summaries
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Above the CLI's default budget, one slice read past it, setup and the final commit; GitHub stops any job at 360.
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    outputs:
      more: ${{ steps.sync.outputs.more }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q .
      - name: Sync
        id: sync
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          BUDGET: ${{ inputs.budget_minutes }}
          EXTRA_ARGS: ${{ inputs.args }}
        run: |
          set -o pipefail
          python -m crs_products run --dataset summaries ${BUDGET:+--budget-minutes "$BUDGET"} $EXTRA_ARGS | tee run.json
      - name: Verify against the manifest
        if: ${{ !inputs.args && steps.sync.outputs.commits > 0 }}
        run: |
          set -o pipefail
          python -m crs_products verify --dataset summaries | tee verify.json
      # A run that changed something commits once, the daily check a few times more. Each commit rewrites the slices it changed, mostly the current congress's House and Senate bills: 2.8 MB together on September 25, 2026, and 6.7 MB for the 117th Congress's at its end. So 200 commits keep the history under about 1.4 GB.
      - name: Squash long history
        if: ${{ !inputs.args && steps.sync.outputs.commits > 0 }}
        run: python -m crs_products squash --dataset summaries --min-commits 200
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          for step in run verify; do
            if [ -s "$step.json" ]; then { echo "### $step"; echo '```json'; cat "$step.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          done

  # A run that ran out of budget while still reading (after an outage, or when many slices must be read again) starts the next one instead of waiting 12 hours. A job of its own, so the job that writes the dataset never holds `actions: write`.
  continue:
    needs: sync
    if: ${{ !inputs.args && needs.sync.outputs.more == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run summaries.yml --ref "$GITHUB_REF_NAME"
