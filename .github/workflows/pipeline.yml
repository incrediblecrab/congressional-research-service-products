# On the schedule, probe: one API request for the product count and the newest product, and one read of the manifest on the Hub. When the probe says a sync is needed, sync within the time budget; after a sync that committed, verify the Hub against the manifest and the API, and squash long history. A sync that ran out of budget while still fetching starts the next run itself.
# Writes to Hugging Face use Trusted Publishing: with `id-token: write`, the CLI sets HF_OIDC_RESOURCE from its --repo, so no Hugging Face token is stored anywhere. The only secret is the api.data.gov key.
name: pipeline

on:
  schedule:
    - cron: "2/5 * * * *"
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutes the sync may run (empty: the CLI default)"
        default: ""
      args:
        description: "Extra run arguments for a bounded test, e.g. --local /tmp/smoke --partitions TE10 --max-units 2 (runs without a probe; skips verify and squash)"
        default: ""

permissions: {}

# One run at a time. GitHub keeps at most one run waiting and cancels older waiting runs, which is what a probe that fires every 5 minutes needs.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Above the CLI's default sync budget plus setup and the final commit; GitHub stops any job at 360.
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    outputs:
      more: ${{ steps.sync.outputs.more }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q .
      - name: Probe
        id: probe
        if: ${{ !inputs.args }}
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          set -o pipefail
          python -m crs_products probe | tee probe.json
      - name: Sync
        id: sync
        if: ${{ steps.probe.outputs.needed == 'true' || inputs.args }}
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          BUDGET: ${{ inputs.budget_minutes }}
          EXTRA_ARGS: ${{ inputs.args }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          set -o pipefail
          python -m crs_products run ${BUDGET:+--budget-minutes "$BUDGET"} $EXTRA_ARGS | tee run.json
      - name: Verify against the manifest and the API
        if: ${{ !inputs.args && steps.sync.outputs.commits > 0 }}
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          set -o pipefail
          python -m crs_products verify --live | tee verify.json
      - name: Squash long history
        if: ${{ !inputs.args && steps.sync.outputs.commits > 0 }}
        run: python -m crs_products squash
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          for step in probe run verify; do
            if [ -s "$step.json" ]; then { echo "### $step"; echo '```json'; cat "$step.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          done

  # GitHub starts scheduled runs late, or drops them, when it is busy. A sync that ran out of budget while still fetching therefore starts the next run instead of waiting; that run probes first, and continues the chain only if it too runs out of budget while fetching. A job of its own, so the job that parses downloaded files never holds `actions: write`.
  continue:
    needs: sync
    if: ${{ !inputs.args && needs.sync.outputs.more == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pipeline.yml --ref "$GITHUB_REF_NAME"

  # GitHub disables schedules in a public repository after 60 days without repository activity.
  keepalive:
    if: github.event.schedule == '41 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Commit if the repository has been idle for 45 days
        run: |
          idle=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$idle" -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the schedule enabled: no commit in 45 days"
            git push
          else
            echo "last commit $(( idle / 86400 )) days ago"
          fi
