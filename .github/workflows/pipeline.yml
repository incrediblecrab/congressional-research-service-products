# On the schedule, probe: one API request for the product count and the newest product, and one read of the dataset's metadata, whose card carries the lease, backoff and listing state from the manifest (downloading manifest.json itself would count as a dataset download). When the probe says a sync is needed, sync within the time budget; after a sync that committed, verify the Hub against the manifest and the API, and squash long history. A sync that ran out of budget while still fetching starts the next run itself.
# Writes to Hugging Face use Trusted Publishing: with `id-token: write`, the CLI sets HF_OIDC_RESOURCE from its --repo, so no Hugging Face token is stored anywhere. The only secret is the api.data.gov key.
name: pipeline

on:
  schedule:
    - cron: "2/5 * * * *"
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutes the sync may run (empty: the CLI default)"
        default: ""
      args:
        description: "Extra run arguments for a bounded test, e.g. --local /tmp/smoke --partitions TE10 --max-units 2 (runs without a probe; skips verify and squash)"
        default: ""

permissions: {}

# One run at a time. GitHub keeps at most one run waiting and cancels older waiting runs, which is what a probe that fires every 5 minutes needs.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Above the CLI's default sync budget plus setup and the final commit; GitHub stops any job at 360.
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    outputs:
      more: ${{ steps.sync.outputs.more }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q .
      - name: Probe
        id: probe
        if: ${{ !inputs.args }}
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          set -o pipefail
          python -m crs_products probe | tee probe.json
      - name: Sync
        id: sync
        if: ${{ steps.probe.outputs.needed == 'true' || inputs.args }}
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          BUDGET: ${{ inputs.budget_minutes }}
          EXTRA_ARGS: ${{ inputs.args }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          set -o pipefail
          python -m crs_products run ${BUDGET:+--budget-minutes "$BUDGET"} $EXTRA_ARGS | tee run.json
      - name: Verify against the manifest and the API
        if: ${{ !inputs.args && steps.sync.outputs.commits > 0 }}
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          set -o pipefail
          python -m crs_products verify --live | tee verify.json
      - name: Squash long history
        if: ${{ !inputs.args && steps.sync.outputs.commits > 0 }}
        run: python -m crs_products squash
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          for step in probe run verify; do
            if [ -s "$step.json" ]; then { echo "### $step"; echo '```json'; cat "$step.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          done

  # GitHub starts scheduled runs late, or drops them, when it is busy. A sync that ran out of budget while still fetching therefore starts the next run instead of waiting; that run probes first, and continues the chain only if it too runs out of budget while fetching. A job of its own, so the job that parses downloaded files never holds `actions: write`.
  continue:
    needs: sync
    if: ${{ !inputs.args && needs.sync.outputs.more == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pipeline.yml --ref "$GITHUB_REF_NAME"

  # GitHub disables schedules in a public repository after 60 days without repository activity. This job makes no commit to prevent that: GitHub Trust & Safety disabled a keepalive project on April 21, 2025 for "circumventing the 60 day inactivity policy" (https://github.com/ddev/github-action-add-on-test/issues/46). Instead it fails once the last commit is 50 days old, so GitHub notifies the owner, who can push one. It runs on every scheduled run, because GitHub drops most of them and did not start the first daily one, on September 25, 2026. The log names the schedule that started the run.
  inactivity:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fail once the repository has gone 50 days without a commit
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "schedule: $SCHEDULE"
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit $days days ago"
          if [ "$days" -ge 50 ]; then
            echo "::error::No commit in $days days. GitHub disables this schedule after 60 days without repository activity, so push a commit to keep the dataset updating."
            exit 1
          fi
